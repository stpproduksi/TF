<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHEET naik TF</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4E89">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F3F4F6;--card:#FFF;--ink:#14181F;--mute:#5B6472;--line:#E3E6EA;--accent:#1D4E89;--good:#157F3C;--bad:#B91C1C;}
  *{box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:18px;margin:0;}
  h1{font-size:16px;font-weight:800;margin:0 0 2px;} .sub{font-size:11px;color:var(--mute);margin-bottom:16px;}
  #formCard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;margin:0 auto;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mute);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .field input:disabled,.field select:disabled{background:#F3F4F6;color:var(--mute);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,78,137,.15);}
  #listBox{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow-y:auto;margin-bottom:14px;background:#fff;}
  #listBox .kosong{padding:12px;font-size:12.5px;color:var(--mute);}
  .item{display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;}
  .item:last-child{border-bottom:none;}
  .item.aktif{background:#EFF6FF;}
  .item .a{font-weight:700;font-size:13px;}
  .item .b{color:var(--mute);font-size:11.5px;margin-top:2px;}
  #infoBox{display:none;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:11px 12px;margin-bottom:14px;font-size:12.5px;}
  #infoBox .r{display:flex;justify-content:space-between;padding:3px 0;}
  #infoBox .r span:last-child{font-weight:700;font-family:'Roboto Mono',monospace;}
  .btn{width:100%;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:8px;color:#fff;cursor:pointer;margin-top:8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  #btnSave{background:var(--accent);margin-top:4px;}
  #btnShare{background:#25D366;}
  #btnReset{background:#fff;color:var(--mute);border:1px solid var(--line);font-size:12.5px;padding:10px;}
  #msg{font-size:12.5px;margin-top:10px;min-height:16px;}
  #msg.ok{color:var(--good);font-weight:700;} #msg.bad{color:var(--bad);font-weight:700;}
</style>
</head>
<body>
<h1>SHEET naik TF</h1>
<div class="sub">Pilih Untuk TF, cari carsheet, lalu pilih data EXT</div>

<div id="formCard">
  <div class="row2">
    <div class="field"><label>Tanggal</label><input type="date" id="fTanggal"></div>
    <div class="field"><label>Shift</label>
      <select id="fShift"><option value="">- pilih -</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
    </div>
  </div>

  <div class="field"><label>Untuk TF</label><select id="fTf" onchange="tfMuatBatch()"></select></div>

  <div class="field"><label>Cari No. Carsheet</label>
    <input type="text" id="fCari" placeholder="ketik carsheet untuk menyaring" oninput="tfRender()">
  </div>

  <div id="listBox"><div class="kosong">Pilih Untuk TF dulu</div></div>

  <div id="infoBox">
    <div class="r"><span>Carsheet</span><span id="iCarsheet">-</span></div>
    <div class="r"><span>Ukuran</span><span id="iUkuran">-</span></div>
    <div class="r"><span>Berat</span><span id="iBerat">-</span></div>
    <div class="r"><span>Ext</span><span id="iExt">-</span></div>
    <div class="r"><span>Nama Ext</span><span id="iNamaExt">-</span></div>
    <div class="r"><span>Jam Input Ext</span><span id="iJamExt">-</span></div>
  </div>

  <div class="field"><label>Nama Operator Thermo</label><input type="text" id="fNamaThermo" placeholder="Nama operator thermo"></div>

  <button id="btnSave" class="btn" onclick="tfSimpan()">Simpan</button>
  <button id="btnShare" class="btn" onclick="tfShareWa()" disabled>Share WA</button>
  <button id="btnReset" class="btn" onclick="tfKosongkan()">Kosongkan Form</button>
  <div id="msg"></div>
</div>

<script>
var WEBAPP_URL='https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
var TF_LIST=['TF5','TF6','TF7','TF8','TF9','TF10','TF12','TF13','TF14','TF15','TF16'];

var tfBatch=[];      // daftar baris EXT yang belum diambil untuk TF terpilih
var tfCurrent=null;  // baris EXT yang dipilih
var tfLast=null;     // data yang sudah tersimpan

function setMsg(t,c){ var m=document.getElementById('msg'); m.textContent=t; m.className=c||''; }
function tanggalHariIni(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jamSekarang(){ var n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }

function tfIsiTf(){
  var sel=document.getElementById('fTf');
  sel.innerHTML='<option value="">- pilih -</option>';
  TF_LIST.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
}

// Ambil baris EXT yang belum diambil ke TF terpilih
function tfMuatBatch(){
  tfPilihNull();
  tfBatch=[];
  var tf=document.getElementById('fTf').value;
  if(!tf){ tfRender(); return; }
  setMsg('Memuat data EXT...','');
  fetch(WEBAPP_URL+'?action=batchOptions&tf='+encodeURIComponent(tf))
    .then(r=>r.json())
    .then(res=>{
      if(res&&res.ok){ tfBatch=res.items||[]; setMsg('','' ); }
      else{ setMsg('Gagal memuat: '+((res&&res.error)||''),'bad'); }
      tfRender();
    })
    .catch(()=>{ setMsg('Gagal memuat data EXT','bad'); tfRender(); });
}

// Tampilkan daftar, disaring dengan teks carsheet
function tfRender(){
  var box=document.getElementById('listBox');
  var cari=document.getElementById('fCari').value.trim().toUpperCase();
  box.innerHTML='';
  if(!document.getElementById('fTf').value){
    box.innerHTML='<div class="kosong">Pilih Untuk TF dulu</div>'; return;
  }
  var list=tfBatch.filter(function(it){ return !cari || String(it.carsheet).toUpperCase().indexOf(cari)!==-1; });
  if(!list.length){
    box.innerHTML='<div class="kosong">Tidak ada data EXT yang belum diambil untuk TF ini</div>'; return;
  }
  list.forEach(function(it){
    var b=document.createElement('button');
    b.type='button';
    b.className='item'+(tfCurrent&&tfCurrent===it?' aktif':'');
    var a=document.createElement('div'); a.className='a';
    a.textContent=it.carsheet+' | '+it.ukuran+' | '+it.berat+' kg';
    var c=document.createElement('div'); c.className='b';
    c.textContent='Ext '+it.ext+' | '+it.namaExt+' | Jam '+it.jam;
    b.appendChild(a); b.appendChild(c);
    b.onclick=function(){ tfPilih(it); };
    box.appendChild(b);
  });
}

function tfPilih(it){
  tfCurrent=it;
  document.getElementById('iCarsheet').textContent=it.carsheet;
  document.getElementById('iUkuran').textContent=it.ukuran;
  document.getElementById('iBerat').textContent=it.berat+' kg';
  document.getElementById('iExt').textContent=it.ext;
  document.getElementById('iNamaExt').textContent=it.namaExt;
  document.getElementById('iJamExt').textContent=it.jam;
  document.getElementById('infoBox').style.display='block';
  tfRender();
  setMsg('Data dipilih. Isi nama operator thermo lalu Simpan.','ok');
}
function tfPilihNull(){
  tfCurrent=null;
  document.getElementById('infoBox').style.display='none';
}

function tfSimpan(){
  var tanggal=document.getElementById('fTanggal').value;
  var shift=document.getElementById('fShift').value;
  var tf=document.getElementById('fTf').value;
  var namaThermo=document.getElementById('fNamaThermo').value.trim();
  if(!tanggal){ setMsg('Tanggal belum diisi','bad'); return; }
  if(!shift){ setMsg('Shift belum dipilih','bad'); return; }
  if(!tf){ setMsg('Untuk TF belum dipilih','bad'); return; }
  if(!tfCurrent){ setMsg('Pilih data EXT dulu','bad'); return; }
  if(!namaThermo){ setMsg('Nama operator thermo belum diisi','bad'); return; }

  var beratAngka=String(tfCurrent.berat||'').replace(/[^0-9.]/g,'')||tfCurrent.berat;
  var data={
    _app:'tf',
    tanggal:tanggal,
    jam:jamSekarang(),
    shift:shift,
    tf:tf,
    carsheet:tfCurrent.carsheet,
    ukuran:tfCurrent.ukuran,
    berat:beratAngka,
    ext:tfCurrent.ext,
    namaExt:tfCurrent.namaExt,
    jamExt:tfCurrent.jam,
    namaThermo:namaThermo
  };

  var btn=document.getElementById('btnSave');
  btn.disabled=true; setMsg('Menyimpan...','');

  fetch(WEBAPP_URL+'?action=save&payload='+encodeURIComponent(JSON.stringify(data)))
    .then(r=>r.text())
    .then(t=>{
      var res;
      try{ res=JSON.parse(t); }catch(e){ res={ok:false,error:t}; }
      if(res&&res.ok){
        tfLast=data;
        tfKunci(true);
        document.getElementById('btnShare').disabled=false;
        setMsg('✅ Tersimpan. Tekan Share WA, lalu Kosongkan Form untuk input berikutnya.','ok');
      } else {
        btn.disabled=false;
        setMsg('❌ Gagal: '+(res.error||'tidak diketahui'),'bad');
      }
    })
    .catch(e=>{
      btn.disabled=false;
      setMsg('❌ Gagal: '+e.message,'bad');
    });
}

function tfKunci(on){
  ['fTanggal','fShift','fTf','fCari','fNamaThermo'].forEach(function(id){
    document.getElementById(id).disabled=on;
  });
  document.getElementById('btnSave').disabled=on;
  document.getElementById('listBox').style.display=on?'none':'block';
}

function tfPesan(d){
  return "✅ SHEET NAIK TF\n"+
    "Tanggal: "+d.tanggal+" | Jam TF: "+d.jam+"\n"+
    "Shift: "+d.shift+" | TF: "+d.tf+"\n"+
    "Carsheet: "+d.carsheet+"\n"+
    "Ukuran: "+d.ukuran+"\n"+
    "Berat: "+d.berat+" kg\n"+
    "Ext: "+d.ext+" | Nama Ext: "+d.namaExt+"\n"+
    "Jam Input Ext: "+d.jamExt+"\n"+
    "Op Thermo: "+d.namaThermo;
}

function tfShareWa(){
  if(!tfLast){ setMsg('Simpan dulu','bad'); return; }
  window.open("https://wa.me/?text="+encodeURIComponent(tfPesan(tfLast)),"_blank");
}

function tfKosongkan(){
  tfLast=null; tfCurrent=null;
  ['fShift','fTf','fCari','fNamaThermo'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('fTanggal').value=tanggalHariIni();
  document.getElementById('infoBox').style.display='none';
  document.getElementById('btnShare').disabled=true;
  tfKunci(false);
  tfBatch=[];
  tfRender();
  setMsg('Form dikosongkan. Pilih Untuk TF untuk input berikutnya.','ok');
}

document.getElementById('fTanggal').value=tanggalHariIni();
tfIsiTf();
tfRender();
</script>
</body>
</html>
