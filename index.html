<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHEET naik TF</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4E89">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<!-- LIB SCAN BARCODE -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--bg:#F3F4F6;--card:#FFF;--ink:#14181F;--mute:#5B6472;--line:#E3E6EA;--accent:#1D4E89;--good:#157F3C;--bad:#B91C1C;}
  *{box-sizing:border-box;} body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:18px;margin:0;}
  h1{font-size:16px;font-weight:800;margin:0 0 2px;} .sub{font-size:11px;color:var(--mute);margin-bottom:16px;}
  #formCard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:420px;}
  .field{margin-bottom:14px;} .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mute);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:7px;background:#fff;}
  #infoBatch{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:11px 12px;margin-bottom:14px;font-size:12.5px;display:none;}
  #infoBatch .r{display:flex;justify-content:space-between;padding:2px 0;} #infoBatch .r span:last-child{font-weight:700;font-family:'Roboto Mono',monospace;}
  #btnSave{width:100%;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;margin-top:4px;}
  #btnSave:disabled{opacity:.6;} #btnWa{width:100%;padding:12px;font-size:14px;font-weight:800;border:none;border-radius:8px;background:#25D366;color:#fff;cursor:pointer;margin-top:8px;display:none;}
  #btnReset{width:100%;padding:10px;font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--mute);margin-top:8px;}
  #msg{font-size:12.5px;margin-top:10px;min-height:16px;} #msg.ok{color:var(--good);font-weight:700;} #msg.bad{color:var(--bad);font-weight:700;}
  /* Modal Scan */
  #scanModal{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.85); z-index:9999; padding:16px; }
  #scanBox{ background:#fff; border-radius:12px; padding:12px; max-width:420px; margin:10% auto 0; }
</style>
</head>
<body>
<h1>SHEET naik TF</h1>
<div class="sub">Pilih TF atau Scan Barcode → simpan ke sheet TF</div>
<div id="formCard">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div class="field"><label>Tanggal</label><input type="date" id="fTanggal"></div>
    <div class="field"><label>Shift</label><select id="fShift"><option value="">- pilih -</option><option value="1">Shift 1</option><option value="2">Shift 2</option><option value="3">Shift 3</option></select></div>
  </div>

  <div class="field"><label>TF</label><select id="fTf" onchange="tfOnGantiTf()"><option value="">- pilih -</option><option>TF5</option><option>TF6</option><option>TF7</option><option>TF8</option><option>TF9</option><option>TF10</option><option>TF12</option><option>TF13</option><option>TF14</option><option>TF15</option><option>TF16</option></select></div>

  <!-- FIELD BARU: SCAN -->
  <div class="field"><label>No. Carsheet (Scan / Manual)</label>
    <div style="display:flex; gap:6px;">
      <input type="text" id="fCarsheetScan" placeholder="scan barcode kitir EXT" style="flex:1;" oninput="tfCariByCarsheetManual()">
      <button type="button" onclick="tfBukaScan()" style="padding:11px 14px; background:#111827; color:#fff; border:none; border-radius:7px; font-weight:800; white-space:nowrap;">📷 SCAN</button>
    </div>
  </div>

  <div class="field"><label>Batch Hasil Extruder (Carsheet)</label><select id="fBatch" onchange="tfOnPilihBatch()" disabled><option value="">- pilih TF dulu / scan dulu -</option></select></div>
  <div id="infoBatch"><div class="r"><span>Ext (line asal)</span><span id="iExt">-</span></div><div class="r"><span>Nama Operator Ext</span><span id="iNamaExt">-</span></div><div class="r"><span>Ukuran</span><span id="iUkuran">-</span></div><div class="r"><span>Berat</span><span id="iBerat">-</span></div><div class="r"><span>Jam Extruder</span><span id="iJam">-</span></div></div>
  <div class="field"><label>Nama Operator Thermo</label><input type="text" id="fNamaThermo" placeholder="Nama Anda"></div>
  <button id="btnSave" onclick="tfSimpan()">Simpan</button>
  <button id="btnWa" onclick="tfShareWa()">Share ke WhatsApp</button>
  <button id="btnReset" onclick="tfResetForm()">Kosongkan Form</button>
  <div id="msg"></div>
</div>

<!-- Modal Scanner -->
<div id="scanModal">
  <div id="scanBox">
    <div style="font-weight:800; margin-bottom:8px; text-align:center;">Scan Barcode Kitir EXT</div>
    <div id="reader" style="width:100%;"></div>
    <button onclick="tfTutupScan()" style="width:100%; margin-top:10px; padding:11px; background:#fff; border:1px solid #ccc; border-radius:8px; font-weight:700;">Tutup Kamera</button>
  </div>
</div>

<script>
var tfBatchItems=[]; var tfLastSaved=null;
function tfSetDefaultTanggal(){var d=new Date();var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');document.getElementById('fTanggal').value=iso;}
tfSetDefaultTanggal();
var WEBAPP_URL='https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
var WA_TARGET_NUMBER='';
function tfJamSekarang(){var n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function tfFetch(url,onSuccess,onError){if(typeof google!=='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError).tfGetBatchOptions(document.getElementById('fTf').value);return;}fetch(url).then(function(r){return r.json();}).then(onSuccess).catch(onError);}
function tfKirimSimpan(data,onSuccess,onError){if(typeof google!=='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError).tfSimpanData(data);return;}fetch(WEBAPP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(function(r){return r.json();}).then(onSuccess).catch(onError);}

function tfOnGantiTf(){
  var tf=document.getElementById('fTf').value;
  var selBatch=document.getElementById('fBatch');
  document.getElementById('infoBatch').style.display='none'; tfBatchItems=[];
  if(!tf){selBatch.disabled=true; selBatch.innerHTML='<option value="">- pilih TF dulu / scan dulu -</option>'; return;}
  selBatch.disabled=true; selBatch.innerHTML='<option value="">- memuat -</option>';
  var url=WEBAPP_URL+'?action=batchOptions&tf='+encodeURIComponent(tf);
  tfFetch(url,function(res){
    if(!res||!res.ok){selBatch.innerHTML='<option value="">- gagal memuat -</option>'; return;}
    tfBatchItems=res.items||[];
    if(tfBatchItems.length===0){selBatch.innerHTML='<option value="">- belum ada batch untuk '+tf+' -</option>'; selBatch.disabled=true; return;}
    var opts='<option value="">- pilih batch -</option>';
    tfBatchItems.forEach(function(it,i){ var label=it.carsheet+' | '+it.ukuran+' | '+it.berat+'kg | '+it.jam; opts+='<option value="'+i+'">'+label+'</option>'; });
    selBatch.innerHTML=opts; selBatch.disabled=false;
    // kalau sudah ada hasil scan sebelumnya, coba auto-pilih
    tfCariByCarsheetManual();
  },function(){selBatch.innerHTML='<option value="">- gagal memuat -</option>';});
}

function tfOnPilihBatch(){
  var idx=document.getElementById('fBatch').value;
  var infoEl=document.getElementById('infoBatch');
  if(idx===''||!tfBatchItems[idx]){infoEl.style.display='none'; return;}
  var it=tfBatchItems[idx];
  document.getElementById('iExt').textContent=it.ext;
  document.getElementById('iNamaExt').textContent=it.namaExt;
  document.getElementById('iUkuran').textContent=it.ukuran;
  document.getElementById('iBerat').textContent=it.berat+' kg';
  document.getElementById('iJam').textContent=it.jam;
  infoEl.style.display='block';
  // sync ke input scan biar kelihatan
  document.getElementById('fCarsheetScan').value=it.carsheet;
}

function tfCariByCarsheetManual(){
  var car = document.getElementById('fCarsheetScan').value.trim();
  if(!car || tfBatchItems.length===0) return;
  var foundIndex = tfBatchItems.findIndex(function(it){ return String(it.carsheet).toLowerCase() === car.toLowerCase(); });
  if(foundIndex>=0){
    document.getElementById('fBatch').value = foundIndex;
    tfOnPilihBatch();
    document.getElementById('msg').textContent='Ditemukan via scan: '+car;
    document.getElementById('msg').className='ok';
  }
}

function tfResetForm(){
  document.getElementById('fShift').value=''; document.getElementById('fTf').value='';
  document.getElementById('fBatch').innerHTML='<option value="">- pilih TF dulu / scan dulu -</option>';
  document.getElementById('fBatch').disabled=true;
  document.getElementById('fCarsheetScan').value='';
  document.getElementById('fNamaThermo').value=''; document.getElementById('infoBatch').style.display='none';
  tfBatchItems=[]; tfSetDefaultTanggal(); document.getElementById('msg').textContent=''; document.getElementById('msg').className='';
}

function tfAmbilForm(){
  var idx=document.getElementById('fBatch').value;
  var it=(idx!==''&&tfBatchItems[idx])?tfBatchItems[idx]:null;
  // fallback: kalau pilih via scan tapi TF belum dipilih, tetap ambil carsheet dari input scan
  var carsheetManual = document.getElementById('fCarsheetScan').value.trim();
  return{_app:'tf',tanggal:document.getElementById('fTanggal').value,jam:tfJamSekarang(),shift:document.getElementById('fShift').value,tf:document.getElementById('fTf').value,carsheet:it?it.carsheet:carsheetManual,ukuran:it?it.ukuran:'',berat:it?it.berat:'',ext:it?it.ext:'',namaExt:it?it.namaExt:'',namaThermo:document.getElementById('fNamaThermo').value.trim()};}
function tfValidasi(d){if(!d.tanggal)return'Tanggal belum diisi.';if(!d.shift)return'Shift belum dipilih.';if(!d.tf)return'TF belum dipilih.';if(!d.carsheet)return'Batch / No. Carsheet belum dipilih / scan.';if(!d.namaThermo)return'Nama operator Thermo belum diisi.';return null;}

function tfShareWa(){
  if(!tfLastSaved) return;
  var d=tfLastSaved;
  var pesan="✅ *SHEET NAIK THERMO*\nTanggal: "+d.tanggal+" | Jam: "+d.jam+"\nShift: "+d.shift+" | TF: "+d.tf+"\nCarsheet: "+d.carsheet+"\nUkuran: "+d.ukuran+"\nBerat: "+d.berat+" kg\nExt Line: "+d.ext+" | Op Ext: "+d.namaExt+"\nOp Thermo: "+d.namaThermo;
  var urlWa = WA_TARGET_NUMBER ? "https://wa.me/"+WA_TARGET_NUMBER+"?text="+encodeURIComponent(pesan) : "https://wa.me/?text="+encodeURIComponent(pesan);
  window.open(urlWa,"_blank");
}

function tfSimpan(){
  var data=tfAmbilForm(); var err=tfValidasi(data); var msgEl=document.getElementById('msg');
  if(err){msgEl.textContent=err;msgEl.className='bad';return;}
  var btn=document.getElementById('btnSave'); btn.disabled=true; msgEl.textContent='Menyimpan...'; msgEl.className='';
  tfKirimSimpan(data,function(res){
    btn.disabled=false;
    if(res&&res.ok){
      msgEl.textContent='Tersimpan. Membuka WhatsApp...'; msgEl.className='ok';
      tfLastSaved=data; document.getElementById('btnWa').style.display='block'; tfShareWa();
      document.getElementById('fShift').value=''; document.getElementById('fTf').value='';
      document.getElementById('fBatch').innerHTML='<option value="">- pilih TF dulu / scan dulu -</option>';
      document.getElementById('fBatch').disabled=true; document.getElementById('infoBatch').style.display='none'; tfBatchItems=[];
    }else{ msgEl.textContent='Gagal simpan: '+(res&&res.error?res.error:'tidak diketahui'); msgEl.className='bad'; }
  },function(e){btn.disabled=false; msgEl.textContent='Gagal simpan: '+(e&&e.message?e.message:e); msgEl.className='bad';});
}

// ---- SCAN LOGIC ----
var html5QrCode;
function tfBukaScan(){
  // cek TF sudah dipilih belum
  if(!document.getElementById('fTf').value){
    alert('Pilih TF dulu sebelum scan, biar daftar batch bisa dicari.');
    return;
  }
  document.getElementById('scanModal').style.display='block';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 280, height: 120 } },
    function(decodedText){
      document.getElementById('fCarsheetScan').value = decodedText;
      tfTutupScan();
      tfCariByCarsheetManual();
    },
    function(error){}
  ).catch(function(err){ alert('Kamera gagal: '+err); document.getElementById('scanModal').style.display='none'; });
}
function tfTutupScan(){
  document.getElementById('scanModal').style.display='none';
  if(html5QrCode){
    html5QrCode.stop().then(function(){ html5QrCode.clear(); }).catch(function(){});
  }
}
</script>
</body>
</html>
